roles:
  orchestrator_codex:
    provider: codex
    launch_dir: "."
    tag: crisai-orchestrator
    role_file: reference/development/roles/orchestrator_codex.md
    writes:
      - cross-area integration
      - reference/
      - README.md
      - DOCUMENTATION.md
      - TESTING.md
      - registry/
      - scripts/
    responsibilities:
      - plan and sequence work
      - assign area agents
      - coordinate hcom threads and bundles
      - integrate changes
      - run final checks
      - own Git metadata writes using approved outside-sandbox commands when needed
      - commit using Conventional Commits
      - push only when explicitly requested by the user

  runtime_codex:
    provider: codex
    launch_dir: runtime
    tag: crisai-runtime
    role_file: reference/development/roles/runtime_codex.md
    paired_with: runtime_claude
    writes:
      - src/crisai/
      - registry/
      - prompts/
      - tests/
    responsibilities:
      - Python runtime and orchestration
      - agents, MCP servers, retrieval, policies
      - FastAPI runtime API

  runtime_claude:
    provider: claude
    launch_dir: runtime
    tag: crisai-runtime
    role_file: reference/development/roles/runtime_claude.md
    paired_with: runtime_codex
    writes:
      - small focused runtime patches when requested
    responsibilities:
      - challenge runtime design
      - review diffs and tests
      - identify coupling, security, and evidence risks

  gem_codex:
    provider: codex
    launch_dir: gem
    tag: crisai-gem
    role_file: reference/development/roles/gem_codex.md
    paired_with: gem_claude
    writes:
      - ui/apps/gem/
      - ui/packages/contracts/ when assigned by orchestrator
      - tests/
    responsibilities:
      - Ink Gem terminal UX
      - hcom-friendly terminal workflows
      - UI event consumption in Gem

  gem_claude:
    provider: claude
    launch_dir: gem
    tag: crisai-gem
    role_file: reference/development/roles/gem_claude.md
    paired_with: gem_codex
    writes:
      - small focused Gem patches when requested
    responsibilities:
      - challenge Gem UX
      - review terminal interaction quality
      - identify accessibility and state-management risks

  web_codex:
    provider: codex
    launch_dir: web
    tag: crisai-web
    role_file: reference/development/roles/web_codex.md
    paired_with: web_claude
    writes:
      - ui/apps/web/
      - ui/packages/contracts/ when assigned by orchestrator
      - tests/
    responsibilities:
      - React web UX
      - workspace browser and upload workflows
      - checkpoint and artefact editing UX

  web_claude:
    provider: claude
    launch_dir: web
    tag: crisai-web
    role_file: reference/development/roles/web_claude.md
    paired_with: web_codex
    writes:
      - small focused web patches when requested
    responsibilities:
      - challenge web UX
      - review React implementation quality
      - identify accessibility and user-flow risks

shared_rules:
  hcom_dir: .hcom
  local_assignments: reference/development/session_assignments.local.yaml
  memory_layer: Claude memory MCP server
  commit_owner: orchestrator_codex
  git_write_owner: orchestrator_codex
  area_agents_git_access: read-only
  push_policy: explicit-user-request-only
  default_review_policy: Claude reviews/challenges and may make small focused patches inside its area when requested.
