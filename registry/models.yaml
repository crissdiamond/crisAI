version: 1

# Optional per-model pricing can be configured with:
# pricing:
#   currency: USD
#   unit: per_1m_tokens
#   input: <provider input-token rate>
#   output: <provider output-token rate>
#   cached_input: <provider cached-input rate>  # optional
#   reasoning: <provider reasoning-token rate>  # optional
# The runtime estimates cost only when provider usage and valid pricing are both present.
models:
  - id: openai_fast
    provider: openai
    model_name: gpt-5.4-mini
    api_key_env: OPENAI_API_KEY

  - id: openai_strong
    provider: openai
    model_name: gpt-5.4
    api_key_env: OPENAI_API_KEY

  - id: openai_nano
    provider: openai
    model_name: gpt-5.4-nano
    api_key_env: OPENAI_API_KEY

  - id: gemini_fast
    provider: gemini
    model_name: gemini/gemini-2.5-flash
    api_key_env: GEMINI_API_KEY

  - id: gemini_strong
    provider: gemini
    model_name: gemini/gemini-2.5-pro
    api_key_env: GEMINI_API_KEY

  - id: anthropic_fast
    provider: anthropic
    model_name: anthropic/claude-3-5-haiku-latest
    api_key_env: ANTHROPIC_API_KEY

  - id: anthropic_reasoning
    provider: anthropic
    model_name: anthropic/claude-sonnet-4-5
    api_key_env: ANTHROPIC_API_KEY

  - id: deepseek_fast
    provider: deepseek
    model_name: deepseek/deepseek-v4-flash
    api_key_env: DEEPSEEK_API_KEY
    thinking:
      type: disabled

  - id: deepseek_reasoner
    provider: deepseek
    model_name: deepseek/deepseek-v4-flash
    api_key_env: DEEPSEEK_API_KEY
    should_replay_reasoning_content: always
    thinking:
      type: enabled
    reasoning_effort: max
