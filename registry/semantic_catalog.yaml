# crisAI legacy semantic catalogue for router terms, peer-verifier patterns,
# and peer-contract substring markers. Task-intent, deliverable, source-family,
# and retrieval-expansion semantics live in registry/semantic_graph.yaml.
# Restart CLI / processes after edits.

version: 1

router:
  discovery_terms:
    # Discovery is signalled by retrieval verbs and source loci, not by bare
    # object-type nouns (document / file / page). Those nouns indicate a source
    # *context*, not a discovery *intent*, and already live in source_markers;
    # keeping them here only inflated discovery_score and the mixed-complexity
    # heuristic (CRISAI-ADR-014). source_marker_signal still fires source_lookup
    # for any source-context prompt, so routing is unchanged.
    - find
    - find me
    - search
    - locate
    - identify
    - list
    - look up
    - look for
    - inspect
    - read
    - onedrive
    - sharepoint
    - intranet
    - drive
    - site
    - path

  design_terms:
    - design
    - draft
    - architecture
    - hld
    - lld
    - proposal
    - option
    - options
    - recommendation
    - target state
    - operating model
    - blueprint
    - solution
    - propose
    - plan

  review_terms:
    - review
    - critique
    - challenge
    - refine
    - improve
    - gaps
    - assumptions
    - weaknesses
    - judge
    - revision
    - evaluate
    - evaluation

  operations_terms:
    # Scope: crisAI's OWN local runtime — CLI, MCP, registry, workspace paths,
    # SharePoint auth, env, logs, traces (see prompts/operations_agent.md). This
    # is a self-support agent, not generic software debugging and not an
    # architecture role. Bare generic trouble words (issue / error / fix /
    # broken / auth / token / login / timeout) were removed: they collide with
    # architecture vocabulary and, because the operations hint fires at two
    # matches, two collisions ("fix the auth design") mis-routed an architecture
    # request to the troubleshooting agent. Terms are now tool-failure-scoped
    # phrases (CRISAI-ADR-014). The operations hint still requires >= 2 matches.
    - debug
    - bug
    - exception
    - not working
    - keeps prompting
    - broken import
    - stack trace
    - traceback
    - importerror
    - module not found
    - command not found
    - connection refused
    - cli error
    - mcp server
    - registry error
    - workspace path
    - env var
    - environment variable
    - startup script
    - sharepoint auth
    - auth failed
    - login failed
    - token cache
    - device code
    - timed out
    - log file
    - error log
    - crashed
    - won't start

  peer_terms:
    - peer mode
    - peer conversation
    - author
    - challenger
    - refiner
    - judge
    - debate
    - peer review
    - use peer mode
    - show the peer conversation
    - challenge and refine

  publication_terms:
    - template
    - templates
    - document this
    - document the outcome
    - turn this into
    - convert this into
    - create a document
    - create the document
    - create a report
    - create slides
    - create a slide deck
    - create a powerpoint
    - create a spreadsheet
    - create an excel
    - write this up
    - package this
    - publish this
    - prepare the artefact
    - prepare a document
    # Produce-context phrases. Bare file-type tokens (e.g. ".pptx") were removed:
    # they matched a *referenced* source file as if it were a publish request
    # (CRISAI-ADR-014). Publication is signalled by produce intent, so a type
    # token only counts inside an "into a …" / "as a …" / "export …" context.
    - into a document
    - into a report
    - into a deck
    - into a slide deck
    - into a powerpoint
    - into a presentation
    - into a word document
    - into a spreadsheet
    - into a .pptx
    - into a .docx
    - into a .xlsx
    - export as
    - export to
    - as a powerpoint
    - as a slide deck
    - as a word document
    - as a spreadsheet
    - template in workspace
    - using the template

  explicit_discovery_patterns:
    - use discovery only
    - discovery only
    - do not use the design agent
    - return only a list
    - return only the list
    - return only a table
    - return only the table
    - do not draft
    - do not summarise

  explicit_peer_patterns:
    - use peer mode
    - peer mode
    - peer review
    - peer conversation
    - show the peer conversation
    - debate this
    - challenge and refine
    - author should propose
    - challenger should
    - refiner should
    - judge should

  criticality_terms:
    - high accuracy
    - extremely accurate
    - accuracy critical
    - critical decision
    - high confidence
    - mission critical
    - must be correct
    - zero tolerance
    - safety critical
    - strict assurance
    - rigorous validation
    - high risk
    - high-impact
    - high impact
    - board level
    - executive review
    - audit-ready
    - production sign-off
    - production signoff
