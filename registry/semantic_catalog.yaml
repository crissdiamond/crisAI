    - guideline
    - guidelines
    - standard
    - standards
    - principle
    - principles
    - specification
    - specifications
    - toolkit
    - playbook
    - reference architecture
    - architecture pattern
    - solution pattern
  data_architecture_terms:
    - data architecture
    - data model
    - data modelling
    - data modeling
    - entity
    - entities
    - attribute
    - attributes
    - domain model
    - canonical model
    - enterprise data model
    - edm
    - schema
    - schemas
    - table
    - tables
    - column
    - columns
    - field
    - fields
    - dataset
    - datasets
    - lineage
    - mapping
    - mappings
    - taxonomy
    - ontology
    - master data
    - reference data
    - data contract
    - data contracts
    - normalization
    - denormalization
    - metadata
  intranet_evidence_positive_marker: "intranet sources"
  intranet_evidence_negative_markers:
    - none were retrieved in this turn
    - no successful intranet fetches
    - no intranet retrieval tools were invoked successfully
  agent_output_signatures:
    retrieval_planner: '^The Retrieval planner:\s*'
    context_retrieval: '^Context Retrieval:\s*'
    context_synthesizer: '^Context Synthesizer:\s*'
    summary: '^Summary:\s*'
    review: '^The Review notes:\s*'
    operations: '^Operations:\s*'
    orchestrator: '^The Orchestrator:\s*'
    design: '^The Author proposes\s+'
    design_author: '^The Author proposes\s+'
    design_refiner: '^The Refiner suggests\s+'
    design_challenger: '^The Challenger highlights that\s+'
    judge: '^The Judge concludes that\s+'
  boilerplate_strip_patterns:
    - '^peer conversation\s+'
    - '^(author|challenger|refiner|judge|final recommendation)\s+'
    - '^(peer mode conversation)\s+'
    - '^(strengths|weaknesses|decision|reason)\s*[:\-]?\s+'

