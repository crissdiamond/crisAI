version: 1

servers:
  - id: workspace
    name: Workspace Server
    description: Read and write notes and artefacts inside the local crisAI workspace.
    enabled: true
    transport: stdio
    command: python
    args:
      - src/crisai/servers/workspace_server.py
      - ./workspace
    working_directory: .
    tags: [local, workspace, documents]
    auth:
      type: none
    tools:
      allow:
        - list_workspace_files
        - read_workspace_file
        - write_workspace_file
        - append_workspace_file
        - search_workspace_text
        - workspace_file_link
        - make_note_path
        - expand_associations
    approval:
      required_for:
        - write_workspace_file
        - append_workspace_file
      mode: auto_approve_local
    risk_level: low

  - id: diagrams
    name: Diagram Server
    description: Generate and validate Mermaid diagrams for architecture artefacts.
    enabled: true
    transport: stdio
    command: python
    args:
      - src/crisai/servers/diagram_server.py
      - ./workspace
    working_directory: .
    tags: [local, diagrams, mermaid]
    auth:
      type: none
    tools:
      allow:
        - generate_mermaid
        - validate_mermaid
        - save_diagram
    approval:
      required_for:
        - save_diagram
      mode: auto_approve_local
    risk_level: low

  - id: documents
    name: Document Reader Server
    description: Extract text from supported document formats inside the crisAI workspace.
    enabled: true
    transport: stdio
    command: python
    args:
      - src/crisai/servers/document_server.py
      - ./workspace
    working_directory: .
    tags: [local, documents, docx, pdf, pptx, xlsx]
    auth:
      type: none
    tools:
      allow:
        - list_supported_document_files
        - get_document_metadata
        - read_document
        - inspect_powerpoint_document
    approval:
      required_for: []
      mode: none
    risk_level: low

  - id: vision
    name: Vision Server
    description: Describe standalone image files and images embedded in PowerPoint slides.
    enabled: true
    transport: stdio
    command: python
    args:
      - src/crisai/servers/image_server.py
      - ./workspace
    working_directory: .
    tags: [local, images, vision]
    auth:
      type: none
    tools:
      allow:
        - describe_image
        - describe_powerpoint_slide_images
    approval:
      required_for: []
      mode: none
    risk_level: low

  - id: sharepoint_docs
    name: SharePoint Docs Server
    description: Search and read SharePoint documents using delegated Microsoft Graph access.
    enabled: true
    transport: stdio
    client_timeout_seconds: 240
    command: python
    args:
      - src/crisai/servers/sharepoint_server.py
      - ./workspace
    working_directory: .
    tags: [sharepoint, documents, graph]
    auth:
      type: delegated_oauth
      provider: microsoft_graph
    tools:
      allow:
        - login_sharepoint
        - sharepoint_auth_status
        - who_am_i
        - list_sites
        - list_my_drives
        - list_site_drives
        - list_drive_items
        - search_drive_documents
        - search_site_drive_documents
        - search_sharepoint_site_documents
        - get_sharepoint_document_metadata
        - get_sharepoint_document_metadata_by_handle
        - read_sharepoint_document
        - read_sharepoint_document_by_handle
        - inspect_sharepoint_powerpoint
        - inspect_sharepoint_powerpoint_by_handle
    approval:
      required_for: []
      mode: none
    risk_level: medium

  - id: intranet
    name: Intranet Content Server
    description: >-
      Search and read configured intranet content sources only
      (see registry/intranet.yaml). SharePoint pages use delegated Microsoft Graph auth.
    enabled: true
    transport: stdio
    client_timeout_seconds: 600
    command: python
    args:
      - src/crisai/servers/intranet_server.py
      - ./workspace
    working_directory: .
    tags: [intranet, pages, graph]
    auth:
      type: delegated_oauth
      provider: microsoft_graph
    tools:
      allow:
        - intranet_login
        - intranet_auth_status
        - intranet_search_pages
        - intranet_list_pages
        - intranet_fetch_page
        - intranet_list_page_links_by_id
        - intranet_search
        - intranet_list_all_pages
        - intranet_fetch
        - intranet_list_page_links
    approval:
      required_for: []
      mode: none
    risk_level: medium

# ---------------------------------------------------------------------------
# Remote server example (SSE transport)
#
# Use transport: sse or transport: streamable-http to connect to an external
# MCP server. Remote servers are not managed as subprocesses by crisAI —
# they must already be running and reachable at the configured url.
#
# api_key_env names an environment variable whose value is injected as
#   Authorization: Bearer <value>
# Additional static headers can be placed under headers:.
#
# - id: remote_knowledge_base
#   name: Remote Knowledge Base
#   description: External MCP server accessible over SSE.
#   enabled: false
#   transport: sse
#   url: https://mcp.example.com/sse
#   api_key_env: REMOTE_MCP_API_KEY
#   headers:
#     X-Tenant-Id: my-tenant
#   tags: [remote]
#   auth:
#     type: api_key
#   tools:
#     allow: []   # empty list = all tools exposed by the server; list names to restrict
# ---------------------------------------------------------------------------
