# Deterministic semantic graph for task intent, source hints, and retrieval query expansion.
#
# Loaded before retrieval agents run; matching is substring / word-boundary
# based (see crisai.orchestration.retrieval_association_graph). When user text
# activates a vertex, emitted facts are used for task contracts and source
# family hints, while all terms on that vertex and neighbours within max_hops
# are surfaced as **hints** in the runtime prompt. Agents still must align
# tools with the actual user request.
#
# Vertices below cluster main-ask semantics plus **industry-common** enterprise
# architecture (EA), data architecture (DA), and solution architecture (SA)
# language. Extend with organisation-specific terms in new vertices rather than
# overloading one node. Maintain associations here instead of growing agent
# markdown prompts or Python marker lists.

version: 1

settings:
  max_hops: 2

vertices:
  # --- Main-ask semantics (task contract) ---
  - id: intent.recommendation
    priority: 80
    terms:
      - recommendation
      - recommendations
      - recommend
      - advise
      - guidance
      - approach
      - proposed approach
      - architecture recommendation
      - design recommendation
      - concise recommendation
      - target state recommendation
      - interim recommendation
      - what should we do
      - what would you recommend
    emits:
      primary_intent: recommend
      deliverable_type: architecture_recommendation
      source_resolution: as_needed
      required_evidence_level: supporting_sources
      success_criteria:
        - Produce the recommendation as the main answer.
        - Use retrieved or supplied context when the request asks for sourced advice.
        - Keep source notes concise and secondary to the recommendation.
      anti_goals:
        - Do not replace the recommendation with a retrieval inventory.
        - Do not repeat the same recommendation across multiple sections.
  - id: intent.design_response
    priority: 70
    terms:
      - design
      - solution design
      - architecture design
      - high level design
      - hld
      - low level design
      - lld
      - target architecture
      - target state
      - interim design
      - target-state design
      - end-to-end design
      - end to end design
      - reference architecture
      - architecture blueprint
      - solution blueprint
    emits:
      primary_intent: design
      deliverable_type: architecture_design
      required_evidence_level: supporting_sources
      success_criteria:
        - Produce the requested design response as the main answer.
        - Separate interim, transition, and target-state guidance when the request asks for them.
        - Ground design constraints in retrieved or supplied context where available.
      anti_goals:
        - Do not replace the design with source-selection commentary.
        - Do not duplicate the same design flow in multiple sections.
  - id: intent.options_analysis
    priority: 90
    terms:
      - options paper
      - option paper
      - options analysis
      - option analysis
      - options appraisal
      - option appraisal
      - trade-off analysis
      - trade off analysis
      - decision paper
      - compare options
      - evaluate options
      - pros and cons
      - recommendation paper
    emits:
      primary_intent: recommend
      deliverable_type: options_paper
      required_evidence_level: supporting_sources
      success_criteria:
        - Compare viable options before recommending a preferred option.
        - Make assumptions, decision criteria, risks, and trade-offs explicit.
        - Keep evidence and context traceable to retrieved or supplied sources.
      anti_goals:
        - Do not present only one option when the user asked for options.
        - Do not hide the decision rationale.
  - id: intent.assessment
    priority: 75
    terms:
      - assess
      - assessment
      - review
      - evaluate
      - maturity assessment
      - gap analysis
      - health check
      - architecture review
      - design review
      - risk assessment
    emits:
      primary_intent: assess
      deliverable_type: assessment
      required_evidence_level: supporting_sources
      success_criteria:
        - Assess the current state against the requested criteria.
        - Highlight material gaps, risks, and recommended next changes.
        - Distinguish evidence from interpretation.
      anti_goals:
        - Do not turn the assessment into a generic explanation.
        - Do not ignore gaps found in retrieved or supplied context.
  - id: intent.summary
    priority: 100
    terms:
      - summarise
      - summarize
      - summary
      - recap
      - overview
      - brief me
      - extract key points
      - key points
      - tell me what this says
      - what does
      - what is in
    emits:
      primary_intent: summarize_source
      required_evidence_level: content_read
      success_criteria:
        - Produce the requested summary as the main answer.
        - Use only content that was actually read or directly supplied.
        - Keep source-selection rationale secondary when source resolution was required.
      anti_goals:
        - Do not make candidate ranking the main answer.
        - Do not add unsupported caveats about unread content.
  - id: intent.source_discovery
    priority: 95
    terms:
      - find all
      - search for files
      - search files
      - list all
      - list all files
      - list all documents
      - best source candidates
      - best file candidates
      - best document candidates
      - most relevant files
      - most relevant documents
      - relevant files
      - relevant documents
      - matching documents
      - matching files
      - documents available
      - files available
      - source inventory
      - document inventory
      - search results
    emits:
      primary_intent: retrieve_source
      deliverable_type: source_inventory
      source_resolution: matching_source
      required_evidence_level: metadata_read
      success_criteria:
        - Return the matching source inventory as the main answer.
        - Include enough source identity for the user to choose or confirm a source.
        - Keep any downstream analysis secondary to the discovered sources.
      anti_goals:
        - Do not replace the requested source list with a generic answer.
        - Do not summarise source contents unless the user asks to read or summarise them.
  - id: deliverable.deck_summary
    priority: 60
    terms:
      - deck
      - presentation
      - powerpoint
      - ppt
      - pptx
      - slides
      - slide
    emits:
      deliverable_type: deck_summary
  - id: deliverable.document_summary
    priority: 60
    terms:
      - document
      - documents
      - doc
      - docx
      - file
      - source document
      - source file
      - source material
      - page
    emits:
      deliverable_type: document_summary
  - id: deliverable.executive_summary
    priority: 65
    terms:
      - executive
      - leadership
      - executive summary
    emits:
      deliverable_type: executive_summary
  - id: source_resolution.latest_matching_source
    priority: 100
    terms:
      - latest
      - most recent
      - newest
      - current
      - master
      - best candidate
      - likely master
    emits:
      source_resolution: latest_matching_source
  - id: source_resolution.matching_source
    priority: 90
    terms:
      - document
      - documents
      - deck
      - presentation
      - powerpoint
      - pptx
      - file
      - source document
      - source file
      - source material
      - page
    emits:
