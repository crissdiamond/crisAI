edges:
  # Intranet / pattern catalogue (original)
  - [intranet_site_pages, document_library_boundary]
  - [intranet_site_pages, integration_patterns_area]
  - [integration_patterns_area, catalogue_and_leaf_drilldown]
  - [integration_principles_corpus, intranet_site_pages]
  - [integration_principles_corpus, catalogue_and_leaf_drilldown]
  - [integration_principles_corpus, integration_patterns_area]
  - [integration_principles_corpus, integration_and_api_architecture]
  - [integration_principles_corpus, enterprise_architecture_core]

  # EA internal links
