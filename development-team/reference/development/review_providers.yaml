# Review provider capability registry for the hcom development team.

default_provider: claude-code

roles:
  runtime_review:
    area: runtime
    default_thread: runtime-review
    claude_role: runtime_claude
    tag: crisai-runtime-review
  gem_review:
    area: gem
    default_thread: gem-ui-review
    claude_role: gem_claude
    tag: crisai-gem-review
  web_review:
    area: web
    default_thread: web-ui-review
    claude_role: web_claude
    tag: crisai-web-review

providers:
  claude-code:
    hcom_tool: claude
    managed: true
    mandatory_gate_supported: true
    ephemeral_supported: true
    persistent_supported: true
  antigravity:
    hcom_tool: agy
    managed: true
    mandatory_gate_supported: preflight_required
    experimental: false
    ephemeral_supported: true
    persistent_supported: true
    mode: hcom_managed_with_reusable_oauth
    requires_existing_oauth: true
    requires_preflight: true
    default_model_env: HCOM_TEAM_ANTIGRAVITY_MODEL
    default_model: Claude Sonnet 4.6
    supports_dangerously_skip_permissions: true
    model_selection_verified: persisted_model_probe
    requires_hcom_tool_support: true
