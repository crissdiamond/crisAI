# Copy to session_assignments.local.yaml or let scripts/hcom_start.sh generate it.
# Random hcom names are session handles only; role ids below are stable.
target_repo: /path/to/crisAI
team_repo: /path/to/crisAI-development-team
hcom_dir: /path/to/crisAI/.hcom
tmux_session: crisai-hcom
sessions:
  nemo:
    role: orchestrator_codex
    area: root
    provider: codex
    tag: crisai-orchestrator
    hcom_session_id: nemo
    # Optional: provider_session_id lets --resume target a Codex or Claude UUID.
    # provider_session_id: <codex-or-claude-session-uuid>
    status: active
  polo:
    role: runtime_codex
    area: runtime
    provider: codex
    tag: crisai-runtime
    hcom_session_id: polo
    status: active
  bolo:
    role: gem_codex
    area: gem
    provider: codex
    tag: crisai-gem
    hcom_session_id: bolo
    status: active
  hula:
    role: web_codex
    area: web
    provider: codex
    tag: crisai-web
    hcom_session_id: hula
    status: active
