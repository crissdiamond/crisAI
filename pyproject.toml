[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crisai"
version = "0.1.0"
description = "Local AI tool platform for architecture and design work"
requires-python = ">=3.10"

dependencies = [
  "openai-agents>=0.2.10,<0.3",
  "openai>=1.0.0,<2",
  "mcp>=1.10.0,<2",
  "python-dotenv>=1.0.1,<2",
  "PyYAML>=6.0.2,<7",
  "fastapi>=0.115.0,<0.136.0",
  "traced",
  "typer>=0.12.3,<1",
  "uvicorn>=0.30.0,<1",
  "rich>=13.7.1,<14",
  "prompt_toolkit>=3.0.0,<4",
  "python-docx>=1.1.0,<2",
  "pypdf>=6.10.2,<7",
  "python-pptx>=0.6.0,<2",
  "openpyxl>=3.1.0,<4",
  "chardet>=5.0.0,<6",
  "msal>=1.28.0,<2",
  "requests>=2.31.0,<3",
  "defusedxml>=0.7.1,<1",
  "starlette>=1.0.1",
  "pdfplumber>=0.11.9",
]

[project.optional-dependencies]
litellm = [
  "openai-agents[litellm]>=0.2.10,<0.3",
]

[dependency-groups]
# Keep this group separate from optional provider extras. The default registry
# needs LiteLLM, so development installs should use:
#   uv sync --extra litellm --group dev
dev = [
  "pytest>=7",
  "pytest-cov>=4",
  "pytest-timeout>=2.3.1",
  "ruff>=0.4",
  "mypy>=1.10",
  "bandit>=1.9.4",
  "pip-audit>=2.10.0",
]

[project.scripts]
crisai = "crisai.cli.main:app"
crisai-web = "crisai.apps.web:main"

[tool.pytest.ini_options]
addopts = "--cov=crisai --cov-report=term-missing"
markers = [
    "smoke: opt-in integration tests that call real LLM APIs (set CRISAI_RUN_SMOKE_TESTS=1)",
]

[tool.coverage.run]
source = ["crisai"]
omit = ["*/tests/*", "*/__init__.py", "*/web/app.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tracing patch must execute before the agents SDK is imported.
"src/crisai/agents/factory.py" = ["E402"]
"src/crisai/cli/pipelines.py" = ["E402"]

[tool.bandit]
exclude_dirs = [
  ".auth",
  ".claude",
  ".codex",
  ".hcom",
  ".secrets",
  ".tokens",
  ".venv",
  "tests",
  "ui/node_modules",
  "ui/apps/gem/dist",
  "ui/apps/web/dist",
  "workspace/.auth",
  "workspace/.cache",
  "workspace/outputs",
  "workspace/tasks",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crisai = ["schemas/*.json", "schemas/*.md"]
