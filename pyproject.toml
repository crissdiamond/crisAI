[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crisai"
version = "0.1.0"
description = "Local AI tool platform for architecture and design work"
requires-python = ">=3.10"

dependencies = [
  "openai-agents>=0.2.10",
  "openai>=1.0.0",
  "mcp>=1.10.0",
  "python-dotenv>=1.0.1",
  "PyYAML>=6.0.2",
  "fastapi>=0.115.0,<0.136.0",
  "traced",
  "typer>=0.12.3",
  "uvicorn>=0.30.0",
  "rich>=13.7.1",
  "prompt_toolkit>=3.0.0",
  "python-docx>=1.1.0",
  "pypdf>=4.0.0",
  "python-pptx>=0.6.0",
  "openpyxl>=3.1.0",
  "chardet>=5.0.0",
  "msal>=1.28.0",
  "requests>=2.31.0"
]

[project.optional-dependencies]
litellm = [
  "openai-agents[litellm]>=0.2.10"
]
dev = [
  "pytest>=7",
  "pytest-timeout>=2.3.1",
  "ruff>=0.4",
  "mypy>=1.10",
]

[project.scripts]
crisai = "crisai.cli.main:app"
crisai-web = "crisai.apps.web:main"

[tool.pytest.ini_options]
timeout = 60
timeout_method = "thread"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tracing patch must execute before the agents SDK is imported.
"src/crisai/agents/factory.py" = ["E402"]
"src/crisai/cli/pipelines.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
