name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: |
          uv sync --locked --extra litellm --group dev

      - name: Lint
        run: |
          uv run ruff check src/ tests/

      - name: Type check
        run: |
          uv run mypy src/

      - name: Validate crisAI registry
        run: |
          uv run crisai doctor

      - name: Run test suite
        run: |
          uv run pytest -q

  ui:
    name: UI workspace
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "ui/package-lock.json"

      - name: Install UI dependencies
        run: |
          npm --prefix ui ci

      - name: Type check UI workspace
        run: |
          npm --prefix ui run typecheck

      - name: Build React web client
        run: |
          npm --prefix ui run build:web

      - name: Build Ink Gem client
        run: |
          npm --prefix ui run build:gem
