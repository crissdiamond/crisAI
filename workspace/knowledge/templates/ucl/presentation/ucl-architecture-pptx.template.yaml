template_id: ucl_architecture_pptx
template_name: UCL Architecture Presentation
output_type: pptx
description: >
  Template manifest for exporting a reviewed Markdown architecture artefact into
  a concise UCL-style PowerPoint deck. Add `template_file: <file>.pptx` beside
  this manifest when official slide masters are available.
source_format: markdown
output_naming: "{task_slug}-architecture-deck.pptx"
max_bullets_per_slide: 6
required_sections:
  - Context
  - Target architecture
  - Key decisions
recommended_sections:
  - Executive summary
  - Options considered
  - Risks
  - Next steps
mappings:
  title: front_matter.title
  slide_sections: markdown_headings
validation:
  preserve_source_content: true
  warn_on_missing_required_sections: true
  do_not_invent_missing_sections: true
