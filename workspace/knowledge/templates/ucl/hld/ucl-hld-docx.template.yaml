template_id: ucl_hld_docx
template_name: UCL High Level Design Word Document
output_type: docx
description: >
  Template manifest for exporting a reviewed Markdown HLD source into a UCL-style
  Word document. Add `template_file: <file>.docx` beside this manifest when an
  official binary template is available.
source_format: markdown
output_naming: "{task_slug}-hld.docx"
required_sections:
  - Context
  - Target architecture
  - Key decisions
  - Risks
  - Assumptions
recommended_sections:
  - Executive summary
  - Scope
  - Non-functional requirements
  - Security
  - Data and integration
  - Operational model
  - Open questions
mappings:
  title: front_matter.title
  context: "## Context"
  target_architecture: "## Target architecture"
  key_decisions: "## Key decisions"
  risks: "## Risks"
  assumptions: "## Assumptions"
validation:
  preserve_source_content: true
  warn_on_missing_required_sections: true
  do_not_invent_missing_sections: true
